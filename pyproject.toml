[project]
name = "e2e_orchestrator"
version = "0.1.0"
description = "Orchestrator + generic agent runtime over the e2e_ontology supply chain ontology."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "e2e-ontology",
    "google-adk>=1.0",
    "linkml-runtime>=1.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
e2e-orchestrator = "e2e_orchestrator.runtime.main:cli"
e2e-narrate = "e2e_orchestrator.runtime.narrative:cli"
e2e-replay = "e2e_orchestrator.runtime.replay:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

# The ontology is a real dependency, consumed from a local editable checkout
# (sibling directory) during development. For a reproducible/CI build, pin it to
# a commit instead, e.g.:
#   e2e-ontology = { git = "https://github.com/mcfitzgerald/e2e_ontology.git", rev = "<sha>" }
[tool.uv.sources]
e2e-ontology = { path = "../e2e_ontology", editable = true }
