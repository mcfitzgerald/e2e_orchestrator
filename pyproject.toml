[project]
name = "e2e_orchestrator"
version = "0.1.0"
description = "Orchestrator + generic agent runtime over the e2e_ontology supply chain ontology."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0",
    "linkml-runtime>=1.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
e2e-orchestrator = "e2e_orchestrator.runtime.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.uv]
# The e2e_ontology repo currently has no pyproject; we surface it on sys.path
# via src/e2e_orchestrator/_bootstrap.py rather than installing it as a package.
# Override via the E2E_ONTOLOGY_PATH env var if the sibling layout doesn't hold.
